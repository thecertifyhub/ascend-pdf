<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ascend Leadership Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --cream:#FBFAF6; --paper:#F3EFE6; --green:#1A4030; --green2:#245741; --gold:#C9A84C; --goldtext:#8A6A1F; --ink:#2B302D; --muted:#4A524C; --line:#E4DED0; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--cream); color:var(--ink); font-family:Manrope, system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  body { border-left:8px solid var(--green); min-height:100vh; }
  .wrap { max-width:880px; margin:0 auto; padding:28px 16px 48px; }
  .logo { height:34px; width:auto; display:block; }
  .eyebrow { margin:36px 0 8px; font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--goldtext); }
  h1 { margin:0; font-family:Fraunces, Georgia, serif; font-weight:600; font-size:clamp(28px,5vw,42px); line-height:1.12; color:var(--green); }
  .sub { margin:12px 0 0; font-size:17px; line-height:1.55; color:var(--muted); max-width:640px; }
  .rule { width:72px; height:3px; background:var(--gold); margin:22px 0 26px; border:0; }
  .player { position:relative; width:100%; aspect-ratio:16/9; background:#0f241b; border-radius:12px; overflow:hidden; box-shadow:0 10px 30px rgba(26,64,48,.18); }
  .player video { width:100%; height:100%; display:block; background:#0f241b; }
  .hint { margin:10px 2px 0; font-size:14px; color:var(--muted); }
  .cta { margin-top:30px; background:var(--green); color:#fff; border-radius:12px; padding:24px 26px; display:flex; flex-direction:column; align-items:flex-start; gap:16px; transition:box-shadow .4s; }
  .cta.glow { box-shadow:0 0 0 4px var(--gold); }
  .cta h2 { margin:0 0 6px; font-family:Fraunces, Georgia, serif; font-weight:600; font-size:22px; }
  .cta h2 .amount { color:var(--gold); white-space:nowrap; }
  .cta p { margin:0; font-size:15px; line-height:1.5; color:#D9E6DF; max-width:620px; }
  .btn { display:inline-block; background:var(--gold); color:var(--green); font-weight:700; font-size:16px; text-decoration:none; padding:14px 22px; border-radius:8px; white-space:nowrap; }
  .btn:hover { filter:brightness(1.05); }
  .btn[aria-disabled="true"] { background:#9fb3a8; color:#1A4030; pointer-events:none; }
  .pdf { display:inline-block; margin-top:18px; color:var(--green2); font-weight:600; text-decoration:underline; text-underline-offset:3px; }
  .steps { margin:34px 0 0; display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .step { background:var(--paper); border-radius:10px; padding:16px; }
  .step b { display:block; font-family:Fraunces, Georgia, serif; color:var(--gold); font-size:24px; margin-bottom:6px; }
  .step span { font-size:14px; line-height:1.45; color:var(--ink); }
  footer { margin-top:44px; padding-top:18px; border-top:1px solid var(--line); font-size:13px; color:var(--muted); }
  footer a { color:var(--green2); }
  .msg { margin-top:60px; font-size:18px; line-height:1.6; color:var(--muted); }
  [hidden] { display:none !important; }
  @media (max-width:640px) {
    body { border-left-width:5px; }
    .steps { grid-template-columns:1fr; }
    .cta { padding:20px; } .btn { width:100%; text-align:center; white-space:normal; }
  }
</style>
</head>

      $("s1").textContent = t.s1; $("s2").textContent = t.s2; $("s3").textContent = t.s3;
      var book = $("book");
      if (d.booking_url) { book.href = d.booking_url; book.textContent = t.book; book.addEventListener("click", function () { send("book_click"); }); }
      else { book.textContent = t.book_soon; book.setAttribute("aria-disabled", "true"); book.removeAttribute("href"); }
      var pdf = $("pdf");
      if (d.pdf_url) { pdf.href = d.pdf_url; pdf.textContent = t.pdf; pdf.addEventListener("click", function () { send("pdf"); }); }
      else pdf.hidden = true;
      footer(L);

      var v = $("video"), marks = [25, 50, 75], sent = {}, played = false;
      v.src = d.video_url;
      v.addEventListener("loadedmetadata", function () { if (v.duration) $("hint").textContent = t.hint(Math.max(1, Math.round(v.duration / 60))); });
      v.addEventListener("play", function () { if (!played) { played = true; send("play"); } });
      v.addEventListener("timeupdate", function () {
        if (!v.duration) return;
        var p = v.currentTime / v.duration * 100;
        for (var i = 0; i < marks.length; i++) if (p >= marks[i] && !sent[marks[i]]) { sent[marks[i]] = 1; send(String(marks[i])); }
        if (p >= 97 && !sent[100]) { sent[100] = 1; send("100"); invite(); }
      });
      v.addEventListener("ended", function () { if (!sent[100]) { sent[100] = 1; send("100"); } invite(); });
      function invite() {
        var c = $("cta"); c.classList.add("glow");
        try { c.scrollIntoView({ behavior: "smooth", block: "center" }); } catch (e) {}
      }
      $("loading").hidden = true; $("main").hidden = false;
    })
    .catch(function () { fail(guess); });
})();
</script>
</body>
</html>
