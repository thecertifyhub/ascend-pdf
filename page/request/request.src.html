  * { box-sizing:border-box; margin:0; padding:0; }

  .lang { display:flex; border:1.5px solid var(--line); border-radius:6px; overflow:hidden; }
  .lang button { border:0; background:transparent; padding:8px 14px; font:700 13px var(--sans); color:var(--body); cursor:pointer; }
  .lang button.on { background:var(--green); color:var(--white); }

  .eyebrow { display:inline-block; color:var(--gold); font-size:13px; font-weight:700; letter-spacing:2px; text-transform:uppercase; margin-bottom:14px; }
  h1 { font-family:var(--display); font-weight:600; font-size:46px; line-height:1.1; letter-spacing:-1px; margin-bottom:16px; text-wrap:balance; }
  .sub { font-size:19px; line-height:1.5; color:var(--cream); max-width:640px; }
  .with-person { display:flex; align-items:center; gap:14px; margin-top:28px; color:var(--mist); font-size:14.5px; }
  .with-person strong { color:var(--white); display:block; font-size:15.5px; }
  .avatar { flex-shrink:0; width:56px; height:56px; border-radius:50%; overflow:hidden; background:var(--gold); border:2px solid var(--gold); }
  .avatar img { width:100%; height:100%; object-fit:cover; display:block; }

  .body { margin-top:-80px; position:relative; z-index:2; padding-bottom:64px; }
  .card { background:var(--white); border:1px solid var(--line); border-radius:10px; padding:28px; margin-bottom:18px; box-shadow:0 10px 30px rgba(26,64,48,.07); }
  .card h2 { font-family:var(--display); font-weight:600; font-size:22px; color:var(--ink); margin-bottom:4px; }
  .card .hint { margin:0 0 18px; font-size:14.5px; color:var(--body); line-height:1.5; }
  .drop { display:block; border:2px dashed #d9d2bd; border-radius:8px; padding:28px 16px; text-align:center; cursor:pointer; background:var(--sand); transition:border-color .2s; }
  .drop:hover, .drop.over { border-color:var(--gold); }
  .drop b { display:block; color:var(--green); font-size:16px; margin-bottom:4px; }
  .drop span { font-size:14px; color:var(--body); }
  .drop.done { border-style:solid; border-color:var(--green); background:#eef4f0; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .full { grid-column:1 / -1; }
  label.f { display:block; font-size:14px; font-weight:700; color:var(--ink); margin-bottom:6px; }
  label.f i { font-style:normal; font-weight:400; color:var(--body); }
  input[type=text], input[type=email], input[type=tel], select, textarea { width:100%; padding:12px 13px; border:1.5px solid #ddd6c4; border-radius:6px; font:16px var(--sans); color:var(--ink); background:var(--white); }
  textarea { min-height:84px; resize:vertical; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--green); box-shadow:0 0 0 3px rgba(36,87,65,.15); }
  .bad input, .bad select, .bad textarea { border-color:var(--err); }
  .msg-err { display:none; color:var(--err); font-size:13px; margin-top:5px; }
  .bad .msg-err { display:block; }
  .yn { display:flex; gap:12px; }
  .yn label { flex:1; display:flex; align-items:center; gap:10px; border:1.5px solid #ddd6c4; border-radius:6px; padding:12px 14px; cursor:pointer; font-size:15px; }
  .yn label:has(input:checked) { border-color:var(--green); background:#eef4f0; }
  .consent { display:flex; gap:12px; align-items:flex-start; font-size:14px; line-height:1.55; color:var(--body); cursor:pointer; }
  .consent input { margin-top:3px; width:18px; height:18px; flex:none; accent-color:var(--green); }
  .btn { display:block; width:100%; background:var(--gold); color:var(--ink); font:700 17px var(--sans); border:0; padding:18px 22px; border-radius:6px; cursor:pointer; box-shadow:0 6px 20px rgba(253,179,56,.3); transition:transform .2s, box-shadow .2s; }
  .btn:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(253,179,56,.4); }
  .btn[disabled] { background:#c9cfc4; box-shadow:none; transform:none; cursor:default; }
  .formerr { color:var(--err); font-size:14px; margin:12px 0 0; }
  .hp { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
  .done-box { background:var(--white); border:1px solid var(--line); border-left:6px solid var(--gold); border-radius:10px; padding:32px; box-shadow:0 10px 30px rgba(26,64,48,.07); }
  .done-box h2 { font-family:var(--display); font-weight:600; font-size:26px; color:var(--green); margin-bottom:8px; }
  .done-box p { font-size:16.5px; line-height:1.55; color:var(--body); }
  #footer { margin-top:28px; font-size:14px; color:var(--body); }
  #footer a { color:var(--green); font-weight:600; }

  .site-footer { background:var(--green-deep); color:var(--white); padding:48px 0 28px; }
  .footer-top { display:flex; justify-content:space-between; gap:32px; flex-wrap:wrap; margin-bottom:28px; }
  .footer-logo { height:40px; width:auto; display:block; margin-bottom:14px; }
  .legal { font-size:13px; color:rgba(255,255,255,.75); line-height:1.7; }
  .legal a, .links a { color:rgba(255,255,255,.85); text-decoration:none; }
  .legal a:hover, .links a:hover { color:var(--white); }
  .links { font-size:14px; line-height:2; }
  .footer-h { font-size:12px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold); margin-bottom:6px; }
  .footer-bottom { padding-top:22px; border-top:1px solid rgba(255,255,255,.15); font-size:12px; color:rgba(255,255,255,.55); line-height:1.5; }
  .footer-bottom p + p { margin-top:8px; }

  @media (max-width:640px) {
    h1 { font-size:32px; } .sub { font-size:17px; } .hero { padding:40px 0 100px; }
    .grid { grid-template-columns:1fr; } .card { padding:20px; } .yn { flex-direction:column; }
    .brand img { height:30px; }
  }
</style>

    if (file.size > 10 * 1024 * 1024) { upload = null; dropState("e_size"); return; }
    fileName = file.name; reading = true; upload = null; dropState();
    var type = ext === "pdf" ? "application/pdf" : "application/vnd.openxmlformats-officedocument.wordprocessingml.document";
    post({ action: "slot", filename: file.name, size: file.size, website: $("website").value })
      .then(function (s) {
        if (!s.signed_url) throw new Error(s.error || "slot");
        return fetch(s.signed_url, { method: "PUT", headers: { "Content-Type": type, "x-upsert": "true" }, body: file })
          .then(function (u) { if (!u.ok) throw new Error("put " + u.status); return s.upload_id; });
      })
      .then(function (id) { upload = id; return post({ action: "read", upload_id: id }); })
      .then(function (c) {
        fillIfEmpty("first_name", c.first_name); fillIfEmpty("last_name", c.last_name);
        fillIfEmpty("email", c.email); fillIfEmpty("phone", c.phone);
        reading = false; dropState();
        if (!document.querySelector(".bad")) $("formerr").hidden = true;
      })
      .catch(function () { reading = false; dropState(upload ? null : "e_up"); });
  }

  $("file").addEventListener("change", function () { pick(this.files[0]); this.value = ""; });
  var drop = $("drop");
  drop.addEventListener("dragover", function (e) { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", function () { drop.classList.remove("over"); });
  drop.addEventListener("drop", function (e) { e.preventDefault(); drop.classList.remove("over"); pick(e.dataTransfer.files[0]); });
  $("target_family").addEventListener("change", paint);
  // a field marked in red clears as soon as it is corrected
  function unmark(e) { var w = e.target.closest ? e.target.closest(".bad") : null; if (w && w.id !== "c_resume") w.classList.remove("bad"); if (!document.querySelector(".bad")) $("formerr").hidden = true; }
  $("form").addEventListener("input", unmark); $("form").addEventListener("change", unmark);
  $("lEN").addEventListener("click", function () { L = "EN"; paint(); });
  $("lFR").addEventListener("click", function () { L = "FR"; paint(); });

  function val(id) { return $(id).value.trim(); }
  function mark(id, bad) { var w = $("w_" + id); if (w) w.classList.toggle("bad", bad); return bad; }
  function inMr() { var r = document.querySelector("input[name=in_mr]:checked"); return r ? r.value === "yes" : null; }
  function doneText() { var p = $("done_p"); p.textContent = T[L].done_p + p.getAttribute("data-email") + "."; }

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    if (sent || reading) return;
    var t = T[L], bad = false;
    ["first_name", "last_name", "target_industry", "target_location"].forEach(function (k) { if (mark(k, !val(k))) bad = true; });
    if (mark("email", !/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(val("email")))) bad = true;
    if (mark("target_family", !val("target_family"))) bad = true;
    if (mark("target_title", val("target_family") === "other" && !val("target_title"))) bad = true;
    if (mark("in_mr", inMr() === null)) bad = true;
    if (mark("consent", !$("consent").checked)) bad = true;
    if (!upload) { dropState("e_resume"); bad = true; }
    var fe = $("formerr");
    if (bad) { fe.textContent = t.e_fix; fe.hidden = false; return; }
    fe.hidden = true; sent = true; $("send").disabled = true; setText("send", t.sending);
    post({ action: "submit", upload_id: upload, lang: L, va: qs.get("va") || "", src: qs.get("src") || "", website: $("website").value,
      first_name: val("first_name"), last_name: val("last_name"), email: val("email"), phone: val("phone"),
      target_family: val("target_family"), target_title: val("target_title"), target_industry: val("target_industry"),
      target_location: val("target_location"), in_mr: inMr(), note: val("note"), consent: true })
      .then(function (j) {
        if (j.ok) {
          $("form").hidden = true; $("done").hidden = false;
          $("done_p").setAttribute("data-email", val("email")); doneText();
          try { window.scrollTo({ top: 0, behavior: "smooth" }); } catch (x) {}
          return;
        }
        sent = false; $("send").disabled = false; setText("send", t.send);
        if (j.error === "duplicate") fe.textContent = t.e_dup;
        else if (j.error === "missing") { (j.fields || []).forEach(function (k) { if (k === "resume") { upload = null; dropState("e_resume"); } else mark(k, true); }); fe.textContent = t.e_fix; }
        else fe.textContent = t.e_fail;
        fe.hidden = false;
      })
      .catch(function () { sent = false; $("send").disabled = false; setText("send", t.send); fe.textContent = t.e_fail; fe.hidden = false; });
  });
  paint();
})();
</script>
</body>
</html>
