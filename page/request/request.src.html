<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your roadmap | Ascend Leadership Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --cream:#FBFAF6; --paper:#F3EFE6; --green:#1A4030; --green2:#245741; --gold:#C9A84C; --goldtext:#8A6A1F; --ink:#2B302D; --muted:#4A524C; --line:#E4DED0; --err:#A8432F; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--cream); color:var(--ink); font-family:Manrope, system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  body { border-left:8px solid var(--green); min-height:100vh; }
  .wrap { max-width:720px; margin:0 auto; padding:28px 16px 56px; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .logo { height:34px; width:auto; display:block; }
  .lang { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .lang button { border:0; background:transparent; padding:7px 12px; font:600 13px Manrope, sans-serif; color:var(--muted); cursor:pointer; }
  .lang button.on { background:var(--green); color:#fff; }
  .eyebrow { margin:34px 0 8px; font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--goldtext); }
  h1 { margin:0; font-family:Fraunces, Georgia, serif; font-weight:600; font-size:clamp(28px,5vw,40px); line-height:1.12; color:var(--green); }
  .sub { margin:12px 0 0; font-size:17px; line-height:1.55; color:var(--muted); }
  .rule { width:72px; height:3px; background:var(--gold); margin:22px 0 26px; border:0; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:22px; margin-bottom:18px; }
  .card h2 { margin:0 0 4px; font-family:Fraunces, Georgia, serif; font-weight:600; font-size:20px; color:var(--green); }
  .card .hint { margin:0 0 16px; font-size:14px; color:var(--muted); line-height:1.5; }
  .drop { display:block; border:2px dashed #CFC6B2; border-radius:10px; padding:26px 16px; text-align:center; cursor:pointer; background:var(--paper); transition:border-color .2s; }
  .drop:hover, .drop.over { border-color:var(--gold); }
  .drop b { display:block; color:var(--green); font-size:16px; margin-bottom:4px; }
  .drop span { font-size:14px; color:var(--muted); }
  .drop.done { border-style:solid; border-color:var(--green2); background:#EEF4F0; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .full { grid-column:1 / -1; }
  label.f { display:block; font-size:14px; font-weight:700; color:var(--ink); margin-bottom:6px; }
  label.f i { font-style:normal; font-weight:400; color:var(--muted); }
  input[type=text], input[type=email], input[type=tel], select, textarea { width:100%; padding:11px 12px; border:1px solid #CFC6B2; border-radius:8px; font:16px Manrope, sans-serif; color:var(--ink); background:#fff; }
  textarea { min-height:76px; resize:vertical; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--gold); outline-offset:0; border-color:var(--gold); }
  .bad input, .bad select, .bad textarea { border-color:var(--err); }
  .msg-err { display:none; color:var(--err); font-size:13px; margin-top:5px; }
  .bad .msg-err { display:block; }
  .yn { display:flex; gap:10px; }
  .yn label { flex:1; display:flex; align-items:center; gap:8px; border:1px solid #CFC6B2; border-radius:8px; padding:11px 12px; cursor:pointer; font-size:15px; }
  .consent { display:flex; gap:10px; align-items:flex-start; font-size:14px; line-height:1.5; color:var(--muted); }
  .consent input { margin-top:3px; width:18px; height:18px; flex:none; }
  .btn { display:block; width:100%; background:var(--gold); color:var(--green); font:700 17px Manrope, sans-serif; border:0; padding:16px 22px; border-radius:8px; cursor:pointer; }
  .btn:hover { filter:brightness(1.05); }
  .btn[disabled] { background:#9fb3a8; cursor:default; }
  .formerr { color:var(--err); font-size:14px; margin:12px 0 0; }
  .hp { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
  .done-box { background:var(--green); color:#fff; border-radius:12px; padding:28px 26px; }
  .done-box h2 { margin:0 0 8px; font-family:Fraunces, Georgia, serif; font-weight:600; font-size:24px; }
  .done-box p { margin:0; font-size:16px; line-height:1.55; color:#D9E6DF; }
  footer { margin-top:40px; padding-top:18px; border-top:1px solid var(--line); font-size:13px; color:var(--muted); }
  footer a { color:var(--green2); }
  [hidden] { display:none !important; }
  @media (max-width:600px) { body { border-left-width:5px; } .grid { grid-template-columns:1fr; } .card { padding:18px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <img class="logo" alt="Ascend Leadership Group" src="data:image/png;base64,__LOGO__">
    <div class="lang"><button type="button" id="lEN">EN</button><button type="button" id="lFR">FR</button></div>
  </div>
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <hr class="rule">

  <form id="form" novalidate>
    <div class="hp" aria-hidden="true"><label>Website <input type="text" id="website" tabindex="-1" autocomplete="off"></label></div>

    <section class="card" id="c_resume">
      <h2 id="h_resume"></h2>
      <p class="hint" id="t_resume"></p>
      <label class="drop" id="drop">
        <b id="drop_b"></b><span id="drop_s"></span>
        <input type="file" id="file" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
      </label>
      <div class="msg-err" id="e_resume"></div>
    </section>

    <section class="card">
      <h2 id="h_you"></h2>
      <p class="hint" id="t_you"></p>
      <div class="grid">
        <div id="w_first_name"><label class="f" for="first_name" id="l_first_name"></label><input type="text" id="first_name" autocomplete="given-name"><div class="msg-err" data-k="req"></div></div>
        <div id="w_last_name"><label class="f" for="last_name" id="l_last_name"></label><input type="text" id="last_name" autocomplete="family-name"><div class="msg-err" data-k="req"></div></div>
        <div id="w_email"><label class="f" for="email" id="l_email"></label><input type="email" id="email" autocomplete="email"><div class="msg-err" data-k="email"></div></div>
        <div id="w_phone"><label class="f" for="phone" id="l_phone"></label><input type="tel" id="phone" autocomplete="tel"></div>
      </div>
    </section>

    <section class="card">
      <h2 id="h_target"></h2>
      <p class="hint" id="t_target"></p>
      <div class="grid">
        <div class="full" id="w_target_family"><label class="f" for="target_family" id="l_target_family"></label><select id="target_family"></select><div class="msg-err" data-k="req"></div></div>
        <div class="full" id="w_target_title"><label class="f" for="target_title" id="l_target_title"></label><input type="text" id="target_title"><div class="msg-err" data-k="req"></div></div>
        <div id="w_target_industry"><label class="f" for="target_industry" id="l_target_industry"></label><input type="text" id="target_industry"><div class="msg-err" data-k="req"></div></div>
        <div id="w_target_location"><label class="f" for="target_location" id="l_target_location"></label><input type="text" id="target_location"><div class="msg-err" data-k="req"></div></div>
        <div class="full" id="w_in_mr"><label class="f" id="l_in_mr"></label>
          <div class="yn"><label><input type="radio" name="in_mr" value="yes"> <span id="yes"></span></label><label><input type="radio" name="in_mr" value="no"> <span id="no"></span></label></div>
          <div class="msg-err" data-k="choose"></div></div>
        <div class="full" id="w_note"><label class="f" for="note" id="l_note"></label><textarea id="note"></textarea></div>
      </div>
    </section>

    <section class="card">
      <div id="w_consent"><label class="consent"><input type="checkbox" id="consent"> <span id="l_consent"></span></label><div class="msg-err" data-k="consent"></div></div>
    </section>

    <button class="btn" type="submit" id="send"></button>
    <p class="formerr" id="formerr" hidden></p>
  </form>

  <div class="done-box" id="done" hidden><h2 id="done_h"></h2><p id="done_p"></p></div>
  <footer id="footer"></footer>
</div>
<script>
(function () {
  var API = "https://jbncsigalbtfwkxpgwso.supabase.co/functions/v1/roadmap-intake";
  var T = {
    EN: {
      eyebrow: "Free roadmap",
      title: "Get your personalized CMRP roadmap",
      sub: "Your market, your gaps, your path. Free, within 48 hours.",
      h_resume: "1. Your resume", t_resume: "We read it to prepare your roadmap and to fill in your details below.",
      drop_b: "Choose your resume", drop_s: "PDF or Word (.docx), 10 MB max", drop_reading: "Reading your resume...", drop_done: "Resume received: ",
      drop_change: "Choose another file",
      e_type: "Please use a PDF or a Word (.docx) file.", e_size: "This file is over 10 MB.", e_up: "The upload did not go through. Please try again.",
      e_resume: "Please add your resume.",
      h_you: "2. Your details", t_you: "Filled in from your resume. Please check them, especially your email.",
      l_first_name: "First name", l_last_name: "Last name", l_email: "Email", l_phone: "Phone <i>(optional)</i>",
      h_target: "3. Your goal", t_target: "The role you want next. Your roadmap is built around it.",
      l_target_family: "Target role", pick: "Choose a role",
      families: [["specialist", "Maintenance specialist"], ["supervisor", "Maintenance supervisor"], ["planner", "Maintenance planner"],
        ["reliability_engineer", "Reliability engineer"], ["manager", "Maintenance manager"], ["asset_management", "Asset management specialist"],
        ["other", "Other, please specify"]],
      l_target_title: "Job title in your own words <i>(optional)</i>", l_target_title_req: "Your target role",
      l_target_industry: "Target industry", ph_industry: "Mining, manufacturing, energy...",
      l_target_location: "Target location", ph_location: "City, province or country",
      l_in_mr: "Do you work in maintenance or reliability today?", yes: "Yes", no: "No",
      l_note: "Anything we should know? <i>(optional)</i>", ph_note: "A recent promotion, a planned move...",
      l_consent: "I agree to receive my roadmap and follow-up emails from Ascend Leadership Group, and to Ascend using my resume to prepare it. I can unsubscribe at any time.",
      send: "Get my free roadmap", sending: "Sending...",
      req: "Required.", email: "Please enter a valid email.", choose: "Please choose an answer.", consent: "Please check this box to continue.",
      e_dup: "We already received a roadmap request from this email in the last 30 days. Check your inbox, or write to us.",
      e_fail: "Something went wrong. Please try again in a minute.", e_fix: "Please complete the fields marked in red.",
      done_h: "We are preparing your roadmap", done_p: "You will receive it by email within 48 hours, at ",
      footer: "Ascend Leadership Group. Questions? Write to "
    },
    FR: {
      eyebrow: "Feuille de route gratuite",
      title: "Obtenez votre feuille de route CMRP personnalisée",
      sub: "Votre marché, vos écarts, votre parcours. Gratuite, sous 48 heures.",
      h_resume: "1. Votre CV", t_resume: "Nous le lisons pour préparer votre feuille de route et remplir vos coordonnées ci-dessous.",
      drop_b: "Choisir votre CV", drop_s: "PDF ou Word (.docx), 10 Mo maximum", drop_reading: "Lecture de votre CV...", drop_done: "CV reçu : ",
      drop_change: "Choisir un autre fichier",
      e_type: "Veuillez utiliser un fichier PDF ou Word (.docx).", e_size: "Ce fichier dépasse 10 Mo.", e_up: "Le téléversement n'a pas abouti. Veuillez réessayer.",
      e_resume: "Veuillez ajouter votre CV.",
      h_you: "2. Vos coordonnées", t_you: "Remplies à partir de votre CV. Veuillez les vérifier, surtout votre courriel.",
      l_first_name: "Prénom", l_last_name: "Nom", l_email: "Courriel", l_phone: "Téléphone <i>(facultatif)</i>",
      h_target: "3. Votre objectif", t_target: "Le poste que vous visez. Votre feuille de route est construite autour de lui.",
      l_target_family: "Poste visé", pick: "Choisissez un poste",
      families: [["specialist", "Spécialiste en maintenance"], ["supervisor", "Superviseur de maintenance"], ["planner", "Planificateur de maintenance"],
        ["reliability_engineer", "Ingénieur fiabilité"], ["manager", "Gestionnaire de maintenance"], ["asset_management", "Spécialiste en gestion des actifs"],
        ["other", "Autre, veuillez préciser"]],
      l_target_title: "Titre du poste dans vos mots <i>(facultatif)</i>", l_target_title_req: "Le poste que vous visez",
      l_target_industry: "Industrie visée", ph_industry: "Mines, fabrication, énergie...",
      l_target_location: "Lieu visé", ph_location: "Ville, province ou pays",
      l_in_mr: "Travaillez-vous en maintenance ou en fiabilité aujourd'hui?", yes: "Oui", no: "Non",
      l_note: "Autre chose à nous dire? <i>(facultatif)</i>", ph_note: "Une promotion récente, un déménagement prévu...",
      l_consent: "J'accepte de recevoir ma feuille de route et les courriels de suivi d'Ascend Leadership Group, et qu'Ascend utilise mon CV pour la préparer. Je peux me désabonner en tout temps.",
      send: "Obtenir ma feuille de route gratuite", sending: "Envoi en cours...",
      req: "Obligatoire.", email: "Veuillez entrer un courriel valide.", choose: "Veuillez choisir une réponse.", consent: "Veuillez cocher cette case pour continuer.",
      e_dup: "Nous avons déjà reçu une demande de feuille de route avec ce courriel au cours des 30 derniers jours. Vérifiez votre boîte de réception, ou écrivez-nous.",
      e_fail: "Une erreur est survenue. Veuillez réessayer dans une minute.", e_fix: "Veuillez compléter les champs indiqués en rouge.",
      done_h: "Nous préparons votre feuille de route", done_p: "Vous la recevrez par courriel sous 48 heures, à ",
      footer: "Ascend Leadership Group. Des questions? Écrivez à "
    }
  };
  function $(id) { return document.getElementById(id); }
  var qs = new URLSearchParams(location.search);
  var L = (qs.get("lang") || "").toLowerCase() === "fr" ? "FR" : (qs.get("lang") || "").toLowerCase() === "en" ? "EN"
    : ((navigator.language || "").toLowerCase().indexOf("fr") === 0 ? "FR" : "EN");
  var upload = null, fileName = "", reading = false, sent = false;

  function post(body) {
    return fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { j._status = r.status; return j; }); });
  }
  function setHTML(id, v) { var e = $(id); if (e) e.innerHTML = v; }
  function setText(id, v) { var e = $(id); if (e) e.textContent = v; }

  function paint() {
    var t = T[L];
    document.documentElement.lang = L === "FR" ? "fr" : "en";
    document.title = (L === "FR" ? "Votre feuille de route" : "Your roadmap") + " | Ascend Leadership Group";
    $("lEN").className = L === "EN" ? "on" : ""; $("lFR").className = L === "FR" ? "on" : "";
    ["eyebrow", "title", "sub", "h_resume", "t_resume", "h_you", "t_you", "h_target", "t_target", "yes", "no", "l_consent", "done_h"].forEach(function (k) { setText(k, t[k]); });
    ["l_first_name", "l_last_name", "l_email", "l_phone", "l_target_family", "l_target_industry", "l_target_location", "l_in_mr", "l_note"].forEach(function (k) { setHTML(k, t[k]); });
    setHTML("l_target_title", $("target_family").value === "other" ? t.l_target_title_req : t.l_target_title);
    $("target_industry").placeholder = t.ph_industry; $("target_location").placeholder = t.ph_location; $("note").placeholder = t.ph_note;
    var sel = $("target_family"), cur = sel.value; sel.innerHTML = "";
    var o0 = document.createElement("option"); o0.value = ""; o0.textContent = t.pick; sel.appendChild(o0);
    t.families.forEach(function (f) { var o = document.createElement("option"); o.value = f[0]; o.textContent = f[1]; sel.appendChild(o); });
    sel.value = cur;
    dropState();
    if (!sent) setText("send", t.send);
    document.querySelectorAll(".msg-err[data-k]").forEach(function (e) { e.textContent = t[e.getAttribute("data-k")]; });
    var f = $("footer"); f.textContent = t.footer;
    var a = document.createElement("a"); a.href = "mailto:christian@ascendleadershipgroup.ca"; a.textContent = "christian@ascendleadershipgroup.ca";
    f.appendChild(a); f.appendChild(document.createTextNode("."));
    if ($("done_p").getAttribute("data-email")) doneText();
  }
  function dropState(err) {
    var t = T[L], d = $("drop");
    d.classList.toggle("done", !!upload && !reading);
    if (reading) { setText("drop_b", t.drop_reading); setText("drop_s", fileName); }
    else if (upload) { setText("drop_b", t.drop_done + fileName); setText("drop_s", t.drop_change); }
    else { setText("drop_b", t.drop_b); setText("drop_s", t.drop_s); }
    setText("e_resume", err ? t[err] : t.e_resume);
    $("c_resume").classList.toggle("bad", !!err);
  }
  function fillIfEmpty(id, v) { if (v && !$(id).value.trim()) { $(id).value = v; var w = $("w_" + id); if (w) w.classList.remove("bad"); } }

  function pick(file) {
    if (!file) return;
    var ext = (file.name.toLowerCase().match(/\.(pdf|docx)$/) || [])[1];
    if (!ext) { upload = null; dropState("e_type"); return; }
    if (file.size > 10 * 1024 * 1024) { upload = null; dropState("e_size"); return; }
    fileName = file.name; reading = true; upload = null; dropState();
    var type = ext === "pdf" ? "application/pdf" : "application/vnd.openxmlformats-officedocument.wordprocessingml.document";
    post({ action: "slot", filename: file.name, size: file.size, website: $("website").value })
      .then(function (s) {
        if (!s.signed_url) throw new Error(s.error || "slot");
        return fetch(s.signed_url, { method: "PUT", headers: { "Content-Type": type, "x-upsert": "true" }, body: file })
          .then(function (u) { if (!u.ok) throw new Error("put " + u.status); return s.upload_id; });
      })
      .then(function (id) { upload = id; return post({ action: "read", upload_id: id }); })
      .then(function (c) {
        fillIfEmpty("first_name", c.first_name); fillIfEmpty("last_name", c.last_name);
        fillIfEmpty("email", c.email); fillIfEmpty("phone", c.phone);
        reading = false; dropState();
        if (!document.querySelector(".bad")) $("formerr").hidden = true;
      })
      .catch(function () { reading = false; dropState(upload ? null : "e_up"); });
  }

  $("file").addEventListener("change", function () { pick(this.files[0]); this.value = ""; });
  var drop = $("drop");
  drop.addEventListener("dragover", function (e) { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", function () { drop.classList.remove("over"); });
  drop.addEventListener("drop", function (e) { e.preventDefault(); drop.classList.remove("over"); pick(e.dataTransfer.files[0]); });
  $("target_family").addEventListener("change", paint);
  // a field marked in red clears as soon as it is corrected
  function unmark(e) { var w = e.target.closest ? e.target.closest(".bad") : null; if (w && w.id !== "c_resume") w.classList.remove("bad"); if (!document.querySelector(".bad")) $("formerr").hidden = true; }
  $("form").addEventListener("input", unmark); $("form").addEventListener("change", unmark);
  $("lEN").addEventListener("click", function () { L = "EN"; paint(); });
  $("lFR").addEventListener("click", function () { L = "FR"; paint(); });

  function val(id) { return $(id).value.trim(); }
  function mark(id, bad) { var w = $("w_" + id); if (w) w.classList.toggle("bad", bad); return bad; }
  function inMr() { var r = document.querySelector("input[name=in_mr]:checked"); return r ? r.value === "yes" : null; }
  function doneText() { var p = $("done_p"); p.textContent = T[L].done_p + p.getAttribute("data-email") + "."; }

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    if (sent || reading) return;
    var t = T[L], bad = false;
    ["first_name", "last_name", "target_industry", "target_location"].forEach(function (k) { if (mark(k, !val(k))) bad = true; });
    if (mark("email", !/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(val("email")))) bad = true;
    if (mark("target_family", !val("target_family"))) bad = true;
    if (mark("target_title", val("target_family") === "other" && !val("target_title"))) bad = true;
    if (mark("in_mr", inMr() === null)) bad = true;
    if (mark("consent", !$("consent").checked)) bad = true;
    if (!upload) { dropState("e_resume"); bad = true; }
    var fe = $("formerr");
    if (bad) { fe.textContent = t.e_fix; fe.hidden = false; return; }
    fe.hidden = true; sent = true; $("send").disabled = true; setText("send", t.sending);
    post({ action: "submit", upload_id: upload, lang: L, va: qs.get("va") || "", src: qs.get("src") || "", website: $("website").value,
      first_name: val("first_name"), last_name: val("last_name"), email: val("email"), phone: val("phone"),
      target_family: val("target_family"), target_title: val("target_title"), target_industry: val("target_industry"),
      target_location: val("target_location"), in_mr: inMr(), note: val("note"), consent: true })
      .then(function (j) {
        if (j.ok) {
          $("form").hidden = true; $("done").hidden = false;
          $("done_p").setAttribute("data-email", val("email")); doneText();
          try { window.scrollTo({ top: 0, behavior: "smooth" }); } catch (x) {}
          return;
        }
        sent = false; $("send").disabled = false; setText("send", t.send);
        if (j.error === "duplicate") fe.textContent = t.e_dup;
        else if (j.error === "missing") { (j.fields || []).forEach(function (k) { if (k === "resume") { upload = null; dropState("e_resume"); } else mark(k, true); }); fe.textContent = t.e_fix; }
        else fe.textContent = t.e_fail;
        fe.hidden = false;
      })
      .catch(function () { sent = false; $("send").disabled = false; setText("send", t.send); fe.textContent = t.e_fail; fe.hidden = false; });
  });
  paint();
})();
</script>
</body>
</html>
