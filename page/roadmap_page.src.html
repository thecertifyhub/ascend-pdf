<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ascend Leadership Group</title>
<link rel="icon" href="/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Same tokens as ascendleadershipgroup.ca */
  :root { --green:#245741; --green-deep:#1a4030; --gold:#fdb338; --ink:#1a1a1a; --body:#4a4a4a; --paper:#fdfcf8; --sand:#f5f3eb;
    --line:#ece8db; --white:#fff; --mist:#c4cbb5; --cream:#f0ede5;
    --display:'Fraunces', Georgia, serif; --sans:'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color-scheme:light; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--sans); color:var(--ink); line-height:1.6; background:var(--paper); -webkit-font-smoothing:antialiased; font-size:16px; }
  .container { max-width:1000px; margin:0 auto; padding:0 24px; }
  [hidden] { display:none !important; }

  .site-nav { background:var(--white); border-bottom:1px solid var(--line); }
  .nav-inner { display:flex; align-items:center; min-height:72px; }
  .brand img { height:42px; width:auto; display:block; }

  .hero { background:linear-gradient(135deg, var(--green) 0%, var(--green-deep) 100%); color:var(--white); padding:56px 0 190px; position:relative; overflow:hidden; }
  .hero::before { content:''; position:absolute; top:-50%; right:-10%; width:600px; height:600px; background:radial-gradient(circle, rgba(253,179,56,.08) 0%, transparent 70%); pointer-events:none; }
  .pre { display:inline-block; color:var(--gold); font-size:13px; font-weight:700; letter-spacing:2px; text-transform:uppercase; margin-bottom:14px; }
  h1 { font-family:var(--display); font-weight:600; font-size:46px; line-height:1.1; letter-spacing:-1px; margin-bottom:16px; text-wrap:balance; }
  h1 .name { color:var(--gold); }
  .hero-sub { font-size:19px; line-height:1.5; color:var(--cream); max-width:700px; }

  .player-wrap { margin-top:-150px; position:relative; z-index:2; }
  .player { position:relative; width:100%; aspect-ratio:16/9; background:#0f241b; border-radius:10px; overflow:hidden; box-shadow:0 24px 60px rgba(26,64,48,.28); }
  .player video { width:100%; height:100%; display:block; background:#0f241b; }
  .play { position:absolute; inset:0; border:0; background:rgba(15,36,27,.18); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .2s; }
  .play:hover { background:rgba(15,36,27,.08); }
  .play span { width:92px; height:92px; border-radius:50%; background:var(--gold); box-shadow:0 10px 30px rgba(0,0,0,.25); display:flex; align-items:center; justify-content:center; transition:transform .2s; }
  .play:hover span { transform:scale(1.06); }
  .play svg { width:34px; height:34px; margin-left:6px; }
  .hint { margin:14px 2px 0; font-size:15px; color:var(--body); }

  .cta { margin-top:36px; background:var(--green-deep); color:var(--white); border-radius:10px; padding:36px; display:grid; grid-template-columns:1fr auto; gap:28px 40px; align-items:center; transition:box-shadow .4s; }
  .cta.glow { box-shadow:0 0 0 4px var(--gold); }
  .cta h2 { font-family:var(--display); font-weight:600; font-size:30px; line-height:1.2; letter-spacing:-.5px; margin-bottom:10px; text-wrap:balance; }
  .cta h2 .amount { color:var(--gold); white-space:nowrap; }
  .cta p { font-size:16.5px; color:var(--mist); max-width:560px; }
  .cta-button { display:inline-block; background:var(--gold); color:var(--ink); padding:18px 38px; font-size:17px; font-weight:700; text-decoration:none; border-radius:6px; box-shadow:0 6px 20px rgba(253,179,56,.3); transition:transform .2s, box-shadow .2s; text-align:center; white-space:nowrap; }
  .cta-button:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(253,179,56,.4); }
  .cta-button[aria-disabled="true"] { background:#9fb3a8; box-shadow:none; pointer-events:none; }
  .with-person { grid-column:1 / -1; display:flex; align-items:center; gap:16px; padding-top:24px; border-top:1px solid rgba(255,255,255,.14); color:var(--mist); font-size:14.5px; }
  .with-person strong { color:var(--white); display:block; font-size:15.5px; }
  .avatar { flex-shrink:0; width:64px; height:64px; border-radius:50%; overflow:hidden; background:var(--gold); border:2px solid var(--gold); }
  .avatar img { width:100%; height:100%; object-fit:cover; display:block; }

  .pdf { display:inline-flex; align-items:center; gap:10px; margin-top:22px; color:var(--green); font-weight:700; text-decoration:none; }
  .pdf:hover { text-decoration:underline; text-underline-offset:3px; }
  .pdf svg { width:20px; height:20px; }

  .results { margin-top:64px; padding:64px 0; background:var(--sand); }
  .section-label { display:inline-block; color:var(--green); font-size:13px; font-weight:700; letter-spacing:2px; text-transform:uppercase; margin-bottom:12px; }
  .results h2 { font-family:var(--display); font-weight:600; font-size:32px; line-height:1.2; letter-spacing:-.5px; margin-bottom:28px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  .card { background:var(--white); border:1px solid var(--line); border-radius:8px; padding:28px; display:flex; flex-direction:column; }
  .card blockquote { font-family:var(--display); font-style:italic; font-size:18px; line-height:1.55; color:var(--ink); margin-bottom:20px; }
  .person { display:flex; align-items:center; gap:14px; margin-top:auto; }
  .person .avatar { width:52px; height:52px; border:0; }
  .author { display:block; font-size:15px; font-weight:700; color:var(--green); }
  .role { display:block; font-size:13px; color:var(--body); margin-top:2px; }
  .foot-note { margin-top:28px; font-size:15px; color:var(--body); }

  .site-footer { background:var(--green-deep); color:var(--white); padding:48px 0 28px; }
  .footer-top { display:flex; justify-content:space-between; gap:32px; flex-wrap:wrap; margin-bottom:28px; }
  .footer-logo { height:40px; width:auto; display:block; margin-bottom:14px; }
  .legal { font-size:13px; color:rgba(255,255,255,.75); line-height:1.7; }
  .legal a, .links a { color:rgba(255,255,255,.85); text-decoration:none; }
  .legal a:hover, .links a:hover { color:var(--white); }
  .links { font-size:14px; line-height:2; }
  .footer-h { font-size:12px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold); margin-bottom:6px; }
  .footer-bottom { padding-top:22px; border-top:1px solid rgba(255,255,255,.15); font-size:12px; color:rgba(255,255,255,.55); line-height:1.5; }
  .footer-bottom p + p { margin-top:8px; }

  .msg { padding:80px 0; font-size:18px; color:var(--body); max-width:640px; }

  @media (max-width:768px) {
    h1 { font-size:32px; } .hero-sub { font-size:17px; } .hero { padding:40px 0 120px; }
    .player-wrap { margin-top:-96px; }
    .cta { grid-template-columns:1fr; padding:26px; } .cta h2 { font-size:25px; } .cta-button { width:100%; white-space:normal; }
    .grid { grid-template-columns:1fr; } .results h2 { font-size:26px; }
    .brand img { height:32px; } .play span { width:72px; height:72px; } .play svg { width:28px; height:28px; }
  }
</style>
</head>
<body>
<header class="site-nav"><div class="container nav-inner"><a class="brand" href="/"><img src="/logo.svg" alt="Ascend Leadership Group" width="270" height="40"></a></div></header>

<div id="loading" class="container msg">&nbsp;</div>
<div id="error" class="container msg" hidden></div>

<main id="main" hidden>
  <section class="hero"><div class="container">
    <span class="pre" id="pre"></span>
    <h1 id="title"></h1>
    <p class="hero-sub" id="sub"></p>
  </div></section>

  <div class="container">
    <div class="player-wrap">
      <div class="player">
        <video id="video" playsinline preload="metadata"></video>
        <button class="play" id="play" type="button"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="#1a1a1a"/></svg></span></button>
      </div>
      <p class="hint" id="hint"></p>
    </div>

    <section class="cta" id="cta">
      <div><h2 id="cta_title"></h2><p id="cta_text"></p></div>
      <a class="cta-button" id="book" target="_blank" rel="noopener"></a>
      <div class="with-person">
        <span class="avatar"><img src="/christian-dimene.jpg" alt="Christian Dimene" width="64" height="64"></span>
        <span><strong id="person_h"></strong><span id="person_t"></span></span>
      </div>
    </section>

    <a class="pdf" id="pdf" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 19h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="pdf_t"></span></a>
  </div>

  <section class="results"><div class="container">
    <span class="section-label" id="res_label"></span>
    <h2 id="res_h"></h2>
    <div class="grid">
      <figure class="card"><blockquote id="q1"></blockquote>
        <figcaption class="person"><span class="avatar"><img src="/alumni/marvin-adjei-mensah.jpg" alt="Marvin Adjei-Mensah" width="52" height="52"></span>
          <span><span class="author">Marvin Adjei-Mensah, P.Eng., CMRP, MASc</span><span class="role" id="r1"></span></span></figcaption></figure>
      <figure class="card"><blockquote id="q2"></blockquote>
        <figcaption class="person"><span class="avatar"><img src="/alumni/maurency-zanga.jpg" alt="Maurency Zanga" width="52" height="52"></span>
          <span><span class="author">Maurency Zanga, M.Sc.A., CPI, CMRP</span><span class="role" id="r2"></span></span></figcaption></figure>
    </div>
    <p class="foot-note" id="res_foot"></p>
  </div></section>
</main>

<footer class="site-footer"><div class="container">
  <div class="footer-top">
    <div><img class="footer-logo" src="/logo-reversed.svg" alt="Ascend Leadership Group" width="270" height="40">
      <div class="legal"><span id="operated"></span><br>Mississauga, Ontario, Canada<br><a href="tel:+19055169367">+1 (905) 516-9367</a><br><a href="mailto:christian@ascendleadershipgroup.ca">christian@ascendleadershipgroup.ca</a></div></div>
    <div class="links"><p class="footer-h" id="legal_h"></p><a id="privacy" href="https://cmrp.thecertifyhub.com/privacy/"></a><br><a id="terms" href="https://cmrp.thecertifyhub.com/terms/"></a><br><a href="https://www.linkedin.com/in/christian-dimene/" target="_blank" rel="noopener">LinkedIn</a></div>
  </div>
  <div class="footer-bottom"><p id="copy"></p><p id="tm"></p></div>
</div></footer>

<script>
(function () {
  var API = "https://jbncsigalbtfwkxpgwso.supabase.co/functions/v1/roadmap-page";
  var T = {
    EN: {
      pre: "Your personalized roadmap",
      title: function (n) { return n ? [n, ", here is your roadmap"] : ["", "Here is your roadmap"]; },
      sub: function (r) { return "Where you stand today, what the market pays and looks for" + (r ? " as " + aAn(r) : "") + ", and the most logical path to get there."; },
      hint: function (m) { return "About " + m + (m > 1 ? " minutes" : " minute") + ". Book your debrief right after watching."; },
      cta_title: "Book your debrief and unlock your $500 discount",
      cta_text: "Right after the video. 15 minutes to answer your questions and confirm your path.",
      book: "Book my debrief", book_soon: "Booking link in your email",
      person_h: "You will speak with Christian Dimene", person_t: "PMP, CMRP, CAMA, PSM. Founder of Ascend Leadership Group.",
      pdf: "Download your roadmap (PDF)",
      res_label: "Results", res_h: "From the professionals who have passed.",
      q1: "“I remember the first sitting, I was beaten by time. But this time around, I had a lot of time to spare.”",
      r1: "Manager of Facilities, Labrador City, Canada",
      q2: "“Eight weeks is very realistic. Two hours every evening and you do it in eight weeks. That is the right dose.”",
      r2: "Maintenance Planner, Glencore Horne Smelter, Rouyn-Noranda, Canada",
      res_foot: "Every professional who has completed our CMRP program has passed the exam.",
      operated: "Operated by The Certify Hub International Inc.", legal_h: "Legal", privacy: "Privacy Policy", terms: "Terms of Service",
      copy: "© 2026 The Certify Hub International Inc. All rights reserved.",
      tm: "CMRP is a registered trademark of the Society for Maintenance & Reliability Professionals (SMRP). PMP is a registered mark of the Project Management Institute (PMI). CAMA is administered by World Partners in Asset Management (WPiAM). Ascend Leadership Group is not affiliated with these organizations.",
      play: "Play your roadmap video",
      error: "This link is no longer active. Reply to the email that came with your roadmap and we will send you a new one."
    },
    FR: {
      pre: "Votre feuille de route personnalisée",
      title: function (n) { return n ? [n, ", voici votre feuille de route"] : ["", "Voici votre feuille de route"]; },
      sub: function (r) { return "Où vous en êtes aujourd'hui, ce que le marché paie et recherche" + (r ? " pour le poste de " + r : "") + ", et le chemin le plus logique pour y arriver."; },
      hint: function (m) { return "Environ " + m + (m > 1 ? " minutes" : " minute") + ". Réservez votre débriefing dès la fin de la vidéo."; },
      cta_title: "Réservez votre débriefing et débloquez votre rabais de 500 $",
      cta_text: "Dès la fin de la vidéo. 15 minutes pour répondre à vos questions et confirmer votre parcours.",
      book: "Réserver mon débriefing", book_soon: "Lien de réservation dans votre courriel",
      person_h: "Vous parlerez avec Christian Dimene", person_t: "PMP, CMRP, CAMA, PSM. Fondateur d'Ascend Leadership Group.",
      pdf: "Télécharger votre feuille de route (PDF)",
      res_label: "Résultats", res_h: "Ils ont réussi avec nous.",
      q1: "« Lors de ma première tentative, j'ai manqué de temps. Cette fois-ci, il m'en restait beaucoup. »",
      r1: "Gestionnaire des installations, Labrador City, Canada",
      q2: "« Huit semaines, c'est très réaliste. Deux heures chaque soir et on y arrive en huit semaines. C'est la bonne dose. »",
      r2: "Planificateur de maintenance, Fonderie Horne de Glencore, Rouyn-Noranda, Canada",
      res_foot: "Tous les professionnels qui ont terminé notre programme CMRP ont réussi l'examen.",
      operated: "Exploité par The Certify Hub International Inc.", legal_h: "Mentions légales", privacy: "Politique de confidentialité", terms: "Conditions d'utilisation",
      copy: "© 2026 The Certify Hub International Inc. Tous droits réservés.",
      tm: "CMRP est une marque déposée de la Society for Maintenance & Reliability Professionals (SMRP). PMP est une marque déposée du Project Management Institute (PMI). CAMA est administré par World Partners in Asset Management (WPiAM). Ascend Leadership Group n'est affilié à aucun de ces organismes.",
      play: "Lire la vidéo de votre feuille de route",
      error: "Ce lien n'est plus actif. Répondez au courriel qui accompagnait votre feuille de route et nous vous en enverrons un nouveau."
    }
  };
  function aAn(s) { return (/^[aeiou]/i.test(s) ? "an " : "a ") + s; }
  function $(id) { return document.getElementById(id); }
  function txt(id, v) { var e = $(id); if (e) e.textContent = v; }
  var token = new URLSearchParams(location.search).get("id") || "";
  var guess = (navigator.language || "").toLowerCase().indexOf("fr") === 0 ? "FR" : "EN";

  function send(ev) {
    try { fetch(API, { method: "POST", keepalive: true, headers: { "Content-Type": "application/json" }, body: JSON.stringify({ t: token, event: ev }) }); } catch (e) {}
  }
  function chrome(L) {
    var t = T[L];
    document.documentElement.lang = L === "FR" ? "fr" : "en";
    ["operated", "legal_h", "privacy", "terms", "copy", "tm"].forEach(function (k) { txt(k, t[k]); });
  }
  function fail(L) { $("loading").hidden = true; $("error").hidden = false; txt("error", T[L].error); chrome(L); }

  fetch(API + "?t=" + encodeURIComponent(token), { headers: { "Accept": "application/json" } })
    .then(function (r) { if (!r.ok) throw new Error("status " + r.status); return r.json(); })
    .then(function (d) {
      var L = d.lang === "FR" ? "FR" : "EN", t = T[L];
      chrome(L);
      document.title = (L === "FR" ? "Votre feuille de route" : "Your roadmap") + " | Ascend Leadership Group";
      txt("pre", t.pre);
      var parts = t.title(d.first_name), h1 = $("title");
      if (parts[0]) { var n = document.createElement("span"); n.className = "name"; n.textContent = parts[0]; h1.appendChild(n); }
      h1.appendChild(document.createTextNode(parts[1]));
      txt("sub", t.sub(d.role));
      // the discount amount in gold inside the title
      (function (el, s) {
        var m = s.match(/(\$500|500 \$)/);
        if (!m) { el.textContent = s; return; }
        var g = document.createElement("span"); g.className = "amount"; g.textContent = m[0];
        el.appendChild(document.createTextNode(s.slice(0, m.index))); el.appendChild(g);
        el.appendChild(document.createTextNode(s.slice(m.index + m[0].length)));
      })($("cta_title"), t.cta_title);
      ["cta_text", "person_h", "person_t", "res_label", "res_h", "q1", "r1", "q2", "r2", "res_foot"].forEach(function (k) { txt(k, t[k]); });
      var book = $("book");
      if (d.booking_url) { book.href = d.booking_url; book.textContent = t.book; book.addEventListener("click", function () { send("book_click"); }); }
      else { book.textContent = t.book_soon; book.setAttribute("aria-disabled", "true"); book.removeAttribute("href"); }
      var pdf = $("pdf");
      if (d.pdf_url) { pdf.href = d.pdf_url; txt("pdf_t", t.pdf); pdf.addEventListener("click", function () { send("pdf"); }); }
      else pdf.hidden = true;

      var v = $("video"), play = $("play"), marks = [25, 50, 75], sent = {}, played = false;
      play.setAttribute("aria-label", t.play);
      if (d.poster_url) v.poster = d.poster_url;   // slide 1 until the video plays
      v.src = d.video_url;
      play.addEventListener("click", function () { play.hidden = true; v.controls = true; v.play(); });
      v.addEventListener("loadedmetadata", function () { if (v.duration) txt("hint", t.hint(Math.max(1, Math.round(v.duration / 60)))); });
      v.addEventListener("play", function () { play.hidden = true; v.controls = true; if (!played) { played = true; send("play"); } });
      v.addEventListener("timeupdate", function () {
        if (!v.duration) return;
        var p = v.currentTime / v.duration * 100;
        for (var i = 0; i < marks.length; i++) if (p >= marks[i] && !sent[marks[i]]) { sent[marks[i]] = 1; send(String(marks[i])); }
        if (p >= 97 && !sent[100]) { sent[100] = 1; send("100"); invite(); }
      });
      v.addEventListener("ended", function () { if (!sent[100]) { sent[100] = 1; send("100"); } invite(); });
      function invite() {
        var c = $("cta"); c.classList.add("glow");
        try { c.scrollIntoView({ behavior: "smooth", block: "center" }); } catch (e) {}
      }
      $("loading").hidden = true; $("main").hidden = false;
    })
    .catch(function () { fail(guess); });
})();
</script>
</body>
</html>
